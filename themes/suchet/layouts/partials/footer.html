<script src="https://cdn.jsdelivr.net/npm/vanilla-lazyload@12.4.0/dist/lazyload.min.js"></script>
<script src="/js/custom.js?v=001"></script>
<!-- Netlify Identity links (invite, password reset, email confirmation) go to the homepage.
     Only /admin/ loads the Identity widget, so send these links there. -->
<script>
    if (/^#(invite|recovery|confirmation|email_change)_token=/.test(location.hash)) {
        location.replace("/admin/" + location.hash);
    }
</script>
